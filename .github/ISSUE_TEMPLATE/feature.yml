name: Feature Request
description: Propose a new feature or enhancement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Before opening: check existing issues and the [milestone board](https://github.com/Sammyduzit/compass/milestones) to avoid duplicates.

  - type: textarea
    id: description
    attributes:
      label: What should be implemented?
      description: Clear description of the feature. What does it do, what does it produce?
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Why is this needed?
      description: What problem does this solve? What's the motivation?
    validations:
      required: true

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance Criteria
      description: Concrete, testable criteria. Use checkboxes.
      placeholder: |
        - [ ] ...
        - [ ] ...
        - [ ] Tests written and passing
        - [ ] CI green
    validations:
      required: true

  - type: textarea
    id: related_issues
    attributes:
      label: Related Issues / Dependencies
      description: Issues this depends on or is blocked by.
      placeholder: "Depends on #XX, Blocked by #YY"

  - type: textarea
    id: notes
    attributes:
      label: Notes for Implementer
      description: Relevant files, architectural hints, existing utilities to reuse, things to watch out for.
      placeholder: |
        - Relevant files: compass/adapters/rules.py, compass/file_selector.py
        - See FINAL.md § RulesAdapter for context
        - Reuse FileSelector.apply_coverage()
