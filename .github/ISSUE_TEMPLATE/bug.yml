name: Bug Report
description: Report something that isn't working correctly
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please fill out as much as you can — incomplete reports are hard to reproduce.

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Python version and OS
      placeholder: "Python 3.12, macOS 14.5"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Exact commands or actions to trigger the bug.
      placeholder: |
        1. Run `compass /path/to/repo --adapters rules`
        2. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should have happened?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What happened instead?
    validations:
      required: true

  - type: textarea
    id: traceback
    attributes:
      label: Error Output / Traceback
      description: Paste the full error output here.
      render: shell

  - type: textarea
    id: related_files
    attributes:
      label: Related Files
      description: Files in the codebase you suspect are involved.
      placeholder: "compass/adapters/rules.py, compass/runner.py"
